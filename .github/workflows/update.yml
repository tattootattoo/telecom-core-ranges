name: Update Core/Backbone Ranges

on:
  schedule:
    - cron: '0 3 * * 0'   # every Sunday at 3 AM UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # GitHub-hosted runners cap at 360 (6h) and that cap can't be
                          # raised, only lowered — this leaves a 60-minute safety buffer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Fetch ASNs per country
        run: python src/fetch_asns.py --region all --resume

      - name: Classify ASNs (Core vs User)
        env:
          PEERINGDB_API_KEY: ${{ secrets.PEERINGDB_API_KEY }}
        run: python src/classify_asn.py --region all --resume

      - name: Fetch announced prefixes
        run: python src/fetch_prefixes.py --region all --resume

      - name: Build final CSV output
        run: python src/build_output.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/asn_cache data/checkpoints output
          git diff --cached --quiet || git commit -m "chore: update core/backbone ranges [automated]"
          git push
