name: Update Core/Backbone Ranges

on:
  schedule:
    - cron: '0 3 * * 0'   # every Sunday at 3 AM UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # GitHub-hosted runners cap at 360 (6h) and that cap can't be
                          # raised, only lowered — this leaves a 60-minute safety buffer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Run pipeline in a loop until done or time runs low
        env:
          PEERINGDB_API_KEY: ${{ secrets.PEERINGDB_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stay well under the job's 300-minute timeout above — the buffer needs to
          # cover one full iteration's worst-case duration, not just be small, since
          # the time check only happens *between* iterations, not during one.
          START_TIME=$(date +%s)
          MAX_SECONDS=$((240 * 60))
          ITERATION=0

          while true; do
            ITERATION=$((ITERATION + 1))
            ELAPSED=$(( $(date +%s) - START_TIME ))
            if [ "$ELAPSED" -ge "$MAX_SECONDS" ]; then
              echo "[stopping] approaching the time budget after $ITERATION iteration(s) — the next scheduled or manual run will pick up from here"
              break
            fi
            echo "=== iteration $ITERATION (elapsed ${ELAPSED}s) ==="

            python src/fetch_asns.py --region all --resume
            python src/classify_asn.py --region all --resume
            python src/fetch_prefixes.py --region all --resume
            python src/build_output.py

            git add data/asn_cache data/checkpoints output
            if git diff --cached --quiet; then
              echo "[done] no new data produced this iteration — every country/ASN is already covered"
              break
            fi
            git commit -m "chore: update core/backbone ranges [automated, iteration $ITERATION]"
            git push
          done
